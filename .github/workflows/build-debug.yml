name: Build debug APK

# Runs when you click "Run workflow" on the Actions tab,
# and on pull requests into main (free while the repo is public;
# remove the pull_request lines before making the repo private).
on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Get the code
        uses: actions/checkout@v5

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle (with caching for faster builds)
        uses: gradle/actions/setup-gradle@v5

      - name: Build the debug APK
        # 4 GB keeps the build within the memory of GitHub's smaller private-repo machines too.
        run: ./gradlew assembleFossDebug --no-daemon "-Dorg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g"

      - name: Upload the APK
        uses: actions/upload-artifact@v5
        with:
          name: scooter-texts-debug
          path: app/build/outputs/apk/foss/debug/*.apk
          if-no-files-found: error
          retention-days: 14
